# Vocab Sensei for friends: `docker compose up -d` from this folder (see deploy/README.md).
name: vocab-sensei

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: vocab_sensei
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab -d vocab_sensei"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rate-limit counts shared by the API's worker processes. Only counts: nothing is saved to disk.
  # Rate-limit counts (database 0) and the background-job queue (database 1). The queue is kept on
  # disk (appendonly) so queued jobs survive a restart; only keys with an expiry (the rate-limit
  # counts) can be evicted when memory is full, never queued jobs.
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: valkey-server --save "" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file: .env
    environment:
      VOCAB_DATABASE_URL: postgresql+psycopg://vocab:${POSTGRES_PASSWORD}@db:5432/vocab_sensei
      VOCAB_DATA_DIR: /data
      VOCAB_AUTH__COOKIE_SECURE: "true" # the public URL is HTTPS (Cloudflare)
      VOCAB_RATE_LIMIT__TRUST_PROXY: "true" # visitors' addresses come from CF-Connecting-IP
      # Raised for now: behind Tailscale Funnel visitors may share one address, so per-visitor
      # limits could be shared by everyone (to check, then restore 10/minute;50/hour and 5/hour).
      VOCAB_RATE_LIMIT__LOGIN: "60/minute;300/hour"
      VOCAB_RATE_LIMIT__EMAIL: "30/hour"
      # Several worker processes (WEB_CONCURRENCY, read by uvicorn) share rate-limit counts in
      # Valkey, and the reminder checks run once, in the `reminders` service, not in each worker.
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      VOCAB_RATE_LIMIT__STORAGE_URI: valkey://valkey:6379
      VOCAB_JOBS__BROKER_URL: redis://valkey:6379/1 # uploads are processed by the `worker` service
      VOCAB_REMINDERS__SCHEDULER_ENABLED: "false"
    volumes:
      - appdata:/data # uploads + WordNet
    healthcheck: # the first start downloads WordNet (~1 minute)
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 5m

  # Daily reminders and weekly recaps: one process, so nobody gets the same reminder twice.
  reminders:
    build: ../backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy # the API applies database migrations first
    env_file: .env
    environment:
      VOCAB_DATABASE_URL: postgresql+psycopg://vocab:${POSTGRES_PASSWORD}@db:5432/vocab_sensei
      VOCAB_DATA_DIR: /data
    volumes:
      - appdata:/data # the push-notification keys
    command: ["python", "-m", "app.commands.run_reminders"]

  # Background jobs (Celery): processing uploaded books, so it doesn't slow the API. At most two
  # at once and two CPUs, leaving the rest for quizzes.
  worker:
    build: ../backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy # the API applies database migrations and installs WordNet first
      valkey:
        condition: service_healthy
    env_file: .env
    environment:
      VOCAB_DATABASE_URL: postgresql+psycopg://vocab:${POSTGRES_PASSWORD}@db:5432/vocab_sensei
      VOCAB_DATA_DIR: /data
      VOCAB_JOBS__BROKER_URL: redis://valkey:6379/1
    volumes:
      - appdata:/data # uploaded files and WordNet
    command: ["celery", "-A", "app.jobs.celery_app", "worker", "--concurrency=2", "--loglevel=INFO"]
    cpus: 2

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:80" # http://localhost:8080 on this Mac only

  # A compressed database backup once a day (the first right after start), kept for 7 days in
  # deploy/backups/. Uploaded book files aren't included: they can be uploaded again.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/vocab_sensei-$$(date +%Y-%m-%d).sql.gz
          if pg_dump -h db -U vocab vocab_sensei | gzip > "$$file.part"; then
            mv "$$file.part" "$$file" && echo "backup written: $$file"
          else
            rm -f "$$file.part"; echo "backup FAILED" >&2
          fi
          find /backups -name 'vocab_sensei-*.sql.gz' -mtime +7 -delete
          sleep 86400
        done

  # A fixed public URL on your own domain (needs a free Cloudflare account): `--profile tunnel`.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    profiles: [tunnel]
    depends_on:
      - web
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-} # from deploy/.env

  # A random https://….trycloudflare.com URL, no account needed, new on every start; for trying
  # things out: `--profile quick-tunnel`, then `docker compose logs quick-tunnel` shows the URL.
  quick-tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    profiles: [quick-tunnel]
    depends_on:
      - web
    command: tunnel --no-autoupdate --url http://web:80

volumes:
  pgdata:
  appdata:
  valkeydata:
