name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          # no-commit-to-branch only makes sense locally
          SKIP: no-commit-to-branch

  # backend: ruff, mypy, pytest       -> added in feat/backend-skeleton
  # frontend: eslint, vitest, build   -> added in feat/frontend-skeleton
