name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          # no-commit-to-branch only makes sense locally; backend/frontend hooks run in their own jobs
          SKIP: no-commit-to-branch,ruff-format,ruff-check,mypy,prettier,eslint

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Architecture layers
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
        env:
          VOCAB_DATABASE_URL: sqlite:///./ci.db

  backend-postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vocab" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PG_URL: postgresql+psycopg://vocab:vocab@localhost:5432/vocab_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Tests on PostgreSQL
        run: uv run pytest -p no:cacheprovider --no-cov
        env:
          VOCAB_TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Migrations apply, match the models and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
        env:
          VOCAB_DATABASE_URL: ${{ env.PG_URL }}

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
