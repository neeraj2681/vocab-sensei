<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:type" content="website">
<style>
:root { --bg: #fff; --fg: #1f2328; --muted: #59636e; --brand: #58a700; --line: #d8dee4; --mark: #fff3a3; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #131f24; --fg: #e8eef1; --muted: #9aa8b0; --line: #2e3d45; --mark: #5a4d00; }
}
body { margin: 0 auto; max-width: 40rem; padding: 1rem; background: var(--bg); color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
a { color: var(--brand); }
h1 { line-height: 1.25; }
ul.plain { list-style: none; padding: 0; }
ul.plain li { padding: .4rem 0; border-bottom: 1px solid var(--line); }
.muted { color: var(--muted); }
.word { padding: 1rem 0; border-bottom: 1px solid var(--line); }
.word h2 { margin: 0; font-size: 1.25rem; }
.word p { margin: .3rem 0 0; }
.sentence { color: var(--muted); font-style: italic; }
mark { background: var(--mark); color: inherit; padding: 0 .1em; border-radius: 3px; }
.button { display: inline-block; background: var(--brand); color: #fff; padding: .7rem 1.2rem;
  border-radius: .6rem; font-weight: 700; text-decoration: none; margin: 1rem 0; }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin: 1rem 0; }
footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
<footer>
<p>Definitions from Open English WordNet (CC BY 4.0). Book text from Project Gutenberg (public domain in the USA).</p>
<p><a href="/">{{ footer_link_text }}</a></p>
</footer>
</body>
</html>
