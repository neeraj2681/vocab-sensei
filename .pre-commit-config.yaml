# Runs on every `git commit` (after `pre-commit install`) and in CI.
# Frontend (eslint, prettier) hooks are added with the frontend skeleton.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # Backend hooks use the project's own tool versions (backend/uv.lock).
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
