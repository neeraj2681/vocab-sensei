<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-green.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1611" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme choice before the first paint, so the page never flashes.
      try {
        const theme = localStorage.getItem('vs-theme')
        if (['light', 'dark', 'sepia'].includes(theme))
          document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <meta
      name="description"
      content="Learn the hard words of the books you read: Vocab Sensei finds them chapter by chapter and teaches them in a quick daily quiz."
    />
    <meta property="og:title" content="Vocab Sensei" />
    <meta
      property="og:description"
      content="Learn the hard words of the books you read: Vocab Sensei finds them chapter by chapter and teaches them in a quick daily quiz."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vocabsensei.win/" />
    <meta property="og:image" content="https://vocabsensei.win/icon-green-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-green.png" />
    <title>Vocab Sensei</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
